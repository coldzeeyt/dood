<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog of the Day - Admin</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #fafafa;
    color: #222;
    padding: 2rem 1rem;
    box-sizing: border-box;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: min(90vw, 360px);
  }
  input, button {
    padding: 0.6rem;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  button {
    background: #222;
    color: white;
    cursor: pointer;
    border: none;
  }
  #status, #autopilot-status { min-height: 1.2rem; font-size: 0.9rem; }
  hr {
    width: min(90vw, 360px);
    border: none;
    border-top: 1px solid #ddd;
    margin: 2rem 0 1.5rem;
  }
  #autopilot-form button { background: #567; }
  p.hint { color: #888; font-size: 0.85rem; width: min(90vw, 360px); margin: 0.5rem 0 0; }
  #queue-link {
    display: inline-block;
    margin-top: 0.5rem;
    color: #567;
    font-size: 0.95rem;
    text-decoration: none;
  }
  #password-form button { background: #a55; }
  #week-autopilot-form button, #both-autopilot-form button { background: #567; }
  #both-form button, #both-autopilot-form button { background: #96c; }
</style>
</head>
<body>
  <h1>Upload Dog of the Day</h1>
  <form id="form">
    <input type="password" name="password" placeholder="Admin password" required>
    <input type="file" name="photo" accept="image/png,image/jpeg,image/gif,image/webp" required>
    <input type="text" name="name" placeholder="Dog's name" maxlength="80" required>
    <input type="text" name="caption" placeholder="Caption (optional)" maxlength="200">
    <button type="submit">Upload</button>
  </form>
  <div id="status"></div>

  <hr>

  <form id="autopilot-form">
    <input type="password" name="password" placeholder="Admin password" required>
    <button type="submit">🎲 Get a random dog now</button>
  </form>
  <p class="hint">Fetches a random dog photo and name automatically instead of uploading your own.</p>
  <div id="autopilot-status"></div>
  <a id="queue-link" href="queue/">📋 Review submitted dogs →</a>

  <hr>

  <h1>Upload Dog of the Week</h1>
  <form id="week-form">
    <input type="password" name="password" placeholder="Admin password" required>
    <input type="file" name="photo" accept="image/png,image/jpeg,image/gif,image/webp" required>
    <input type="text" name="name" placeholder="Dog's name" maxlength="80" required>
    <input type="text" name="caption" placeholder="Caption (optional)" maxlength="200">
    <button type="submit">Upload</button>
  </form>
  <div id="week-status"></div>

  <form id="week-autopilot-form">
    <input type="password" name="password" placeholder="Admin password" required>
    <button type="submit">🎲 Get a random week dog now</button>
  </form>
  <div id="week-autopilot-status"></div>
  <p class="hint">Dog of the Week updates automatically every Monday at midnight if you haven't uploaded one that week.</p>

  <hr>

  <h1>Update Both at Once</h1>
  <form id="both-form">
    <input type="password" name="password" placeholder="Admin password" required>
    <input type="file" name="photo" accept="image/png,image/jpeg,image/gif,image/webp" required>
    <input type="text" name="name" placeholder="Dog's name" maxlength="80" required>
    <input type="text" name="caption" placeholder="Caption (optional)" maxlength="200">
    <button type="submit">Set as both Day and Week</button>
  </form>
  <div id="both-status"></div>

  <hr>

  <form id="password-form">
    <input type="password" name="currentPassword" placeholder="Current password" required>
    <input type="password" name="newPassword" placeholder="New password" minlength="4" required>
    <input type="password" name="confirmPassword" placeholder="Confirm new password" minlength="4" required>
    <button type="submit">Change password</button>
  </form>
  <div id="password-status"></div>

  <script src="../config.js"></script>
  <script>
    const API_BASE = window.DOOD_API_BASE || '';

    const form = document.getElementById('form');
    const status = document.getElementById('status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Uploading...';
      try {
        const res = await fetch(`${API_BASE}/api/upload`, { method: 'POST', body: new FormData(form), signal: AbortSignal.timeout(60000) });
        const data = await res.json();
        if (!res.ok) {
          status.textContent = `Error: ${data.error || 'upload failed'}`;
          return;
        }
        status.textContent = 'Uploaded! The homepage is now updated.';
        form.reset();
      } catch (err) {
        status.textContent = err.name === 'TimeoutError' || err.name === 'AbortError'
          ? 'Upload timed out — check your connection and try again.'
          : 'Upload failed — check your connection and try again.';
      }
    });

    const autopilotForm = document.getElementById('autopilot-form');
    const autopilotStatus = document.getElementById('autopilot-status');
    autopilotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      autopilotStatus.textContent = 'Fetching a dog...';
      try {
        const res = await fetch(`${API_BASE}/api/autopilot`, { method: 'POST', body: new FormData(autopilotForm), signal: AbortSignal.timeout(60000) });
        const data = await res.json();
        if (!res.ok) {
          autopilotStatus.textContent = `Error: ${data.error || 'failed'}`;
          return;
        }
        autopilotStatus.textContent = `Got it! ${data.name} is now the dog of the day.`;
        autopilotForm.reset();
      } catch (err) {
        autopilotStatus.textContent = err.name === 'TimeoutError' || err.name === 'AbortError'
          ? 'Request timed out — check your connection and try again.'
          : 'Request failed — check your connection and try again.';
      }
    });

    const weekForm = document.getElementById('week-form');
    const weekStatus = document.getElementById('week-status');
    weekForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      weekStatus.textContent = 'Uploading...';
      try {
        const res = await fetch(`${API_BASE}/api/upload-week`, { method: 'POST', body: new FormData(weekForm), signal: AbortSignal.timeout(60000) });
        const data = await res.json();
        if (!res.ok) {
          weekStatus.textContent = `Error: ${data.error || 'upload failed'}`;
          return;
        }
        weekStatus.textContent = 'Uploaded! The homepage is now updated.';
        weekForm.reset();
      } catch (err) {
        weekStatus.textContent = err.name === 'TimeoutError' || err.name === 'AbortError'
          ? 'Upload timed out — check your connection and try again.'
          : 'Upload failed — check your connection and try again.';
      }
    });

    const weekAutopilotForm = document.getElementById('week-autopilot-form');
    const weekAutopilotStatus = document.getElementById('week-autopilot-status');
    weekAutopilotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      weekAutopilotStatus.textContent = 'Fetching a dog...';
      try {
        const res = await fetch(`${API_BASE}/api/autopilot-week`, { method: 'POST', body: new FormData(weekAutopilotForm), signal: AbortSignal.timeout(60000) });
        const data = await res.json();
        if (!res.ok) {
          weekAutopilotStatus.textContent = `Error: ${data.error || 'failed'}`;
          return;
        }
        weekAutopilotStatus.textContent = `Got it! ${data.name} is now the dog of the week.`;
        weekAutopilotForm.reset();
      } catch (err) {
        weekAutopilotStatus.textContent = err.name === 'TimeoutError' || err.name === 'AbortError'
          ? 'Request timed out — check your connection and try again.'
          : 'Request failed — check your connection and try again.';
      }
    });

    const bothForm = document.getElementById('both-form');
    const bothStatus = document.getElementById('both-status');
    bothForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      bothStatus.textContent = 'Uploading...';
      try {
        const res = await fetch(`${API_BASE}/api/upload-both`, { method: 'POST', body: new FormData(bothForm), signal: AbortSignal.timeout(60000) });
        const data = await res.json();
        if (!res.ok) {
          bothStatus.textContent = `Error: ${data.error || 'upload failed'}`;
          return;
        }
        bothStatus.textContent = `Uploaded! ${data.name} is now both the dog of the day and the week.`;
        bothForm.reset();
      } catch (err) {
        bothStatus.textContent = err.name === 'TimeoutError' || err.name === 'AbortError'
          ? 'Upload timed out — check your connection and try again.'
          : 'Upload failed — check your connection and try again.';
      }
    });

    const passwordForm = document.getElementById('password-form');
    const passwordStatus = document.getElementById('password-status');
    passwordForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = passwordForm.newPassword.value;
      const confirmPassword = passwordForm.confirmPassword.value;
      if (newPassword !== confirmPassword) {
        passwordStatus.textContent = "New password and confirmation don't match.";
        return;
      }
      passwordStatus.textContent = 'Changing password...';
      try {
        const body = new FormData();
        body.set('currentPassword', passwordForm.currentPassword.value);
        body.set('newPassword', newPassword);
        const res = await fetch(`${API_BASE}/api/change-password`, { method: 'POST', body, signal: AbortSignal.timeout(30000) });
        const data = await res.json();
        if (!res.ok) {
          passwordStatus.textContent = `Error: ${data.error || 'failed'}`;
          return;
        }
        passwordStatus.textContent = 'Password changed. Use the new one from now on.';
        passwordForm.reset();
      } catch (err) {
        passwordStatus.textContent = 'Request failed — check your connection and try again.';
      }
    });
  </script>
</body>
</html>
