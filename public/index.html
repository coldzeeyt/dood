<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog of the Day</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #fafafa;
    color: #222;
    text-align: center;
    padding: 2rem 1rem;
    box-sizing: border-box;
  }
  h1 { margin-bottom: 1rem; }
  #name { margin-top: 1rem; font-size: 1.4rem; font-weight: 600; }
  #photo {
    max-width: min(90vw, 500px);
    max-height: 60vh;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  #caption { margin-top: 1rem; font-size: 1.1rem; }
  #updated { margin-top: 0.5rem; font-size: 0.85rem; color: #888; }
  #empty {
    max-width: min(90vw, 500px);
    max-height: 60vh;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    background: #fff;
    padding: 2rem;
    box-sizing: border-box;
  }
  #empty svg { width: 180px; height: 180px; }
  #empty p { color: #888; margin: 1rem 0 0; }
  a { color: inherit; }
  #admin-link {
    margin-top: 2rem;
    font-size: 0.85rem;
    color: #aaa;
    text-decoration: none;
  }
  #about-btn {
    margin-top: 0.75rem;
    font-size: 0.85rem;
    color: #aaa;
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }
  #about-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    padding: 1rem;
    box-sizing: border-box;
    z-index: 10;
  }
  #about-overlay.open { display: flex; }
  #about-modal {
    background: #fff;
    color: #222;
    border-radius: 16px;
    max-width: min(90vw, 420px);
    max-height: 85vh;
    overflow-y: auto;
    padding: 1.5rem;
    box-sizing: border-box;
    text-align: center;
    position: relative;
  }
  #about-modal h2 { margin: 0 0 1rem; }
  #about-modal img {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 1rem;
  }
  #about-modal p { line-height: 1.5; margin: 0.5rem 0; }
  #about-close {
    position: absolute;
    top: 0.75rem;
    right: 0.9rem;
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: #888;
    line-height: 1;
  }
</style>
</head>
<body>
  <h1>🐶 Dog of the Day</h1>
  <div id="content">
    <div id="empty">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="60" cy="70" rx="22" ry="30" fill="#c98a4b" transform="rotate(-25 60 70)"/>
        <ellipse cx="140" cy="70" rx="22" ry="30" fill="#c98a4b" transform="rotate(25 140 70)"/>
        <circle cx="100" cy="105" r="65" fill="#e3a96b"/>
        <ellipse cx="100" cy="125" rx="35" ry="28" fill="#fbe8d3"/>
        <circle cx="75" cy="95" r="9" fill="#3a2a20"/>
        <circle cx="125" cy="95" r="9" fill="#3a2a20"/>
        <ellipse cx="100" cy="120" rx="10" ry="7" fill="#3a2a20"/>
        <path d="M100 127 Q100 138 88 138" stroke="#3a2a20" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M78 148 Q100 165 122 148" stroke="#3a2a20" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="100" cy="158" rx="12" ry="16" fill="#ef8c9e"/>
      </svg>
      <p>This is a placeholder — the real dog of the day will show up here once one's uploaded.</p>
    </div>
  </div>
  <a id="admin-link" href="admin/">Upload a new dog →</a>
  <button id="about-btn" type="button">About the Creator</button>

  <div id="about-overlay">
    <div id="about-modal">
      <button id="about-close" type="button" aria-label="Close">&times;</button>
      <h2>About the Creator</h2>
      <img src="shirley.jpg" alt="Shirley the dog">
      <p>I'm David and I love dogs and I needed a page to look at all of the good boys (and girls) for the day! This is my dog Shirley!!</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const aboutBtn = document.getElementById('about-btn');
    const aboutOverlay = document.getElementById('about-overlay');
    const aboutClose = document.getElementById('about-close');
    aboutBtn.addEventListener('click', () => aboutOverlay.classList.add('open'));
    aboutClose.addEventListener('click', () => aboutOverlay.classList.remove('open'));
    aboutOverlay.addEventListener('click', (e) => {
      if (e.target === aboutOverlay) aboutOverlay.classList.remove('open');
    });

    const API_BASE = window.DOOD_API_BASE || '';
    fetch(`${API_BASE}/api/current`)
      .then((r) => r.json())
      .then((data) => {
        if (!data || !data.url) return;
        const content = document.getElementById('content');
        const imgSrc = data.url.startsWith('http') ? data.url : `${API_BASE}${data.url}`;
        content.innerHTML = `
          <img id="photo" src="${imgSrc}" alt="${data.name || 'Dog of the day'}">
          ${data.name ? `<div id="name">${data.name}</div>` : ''}
          ${data.caption ? `<div id="caption">${data.caption}</div>` : ''}
          <div id="updated">Updated ${new Date(data.updatedAt).toLocaleString()}</div>
        `;
      })
      .catch(() => {});
  </script>
</body>
</html>
